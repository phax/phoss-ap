#
# Two phoss AP instances (A and B) that exchange Peppol messages with each other locally -
# WITHOUT official Peppol test certificates and without SMP/SML. For development only.
#
# Usage (from the repository root):
#   mvn clean install -DskipTests
#   docker/two-instances/generate-certs.sh
#   docker compose -f docker/two-instances/docker-compose.yml up -d --build
#
# AP A: http://localhost:8081   AP B: http://localhost:8082
# Received documents: docker compose -f docker/two-instances/docker-compose.yml exec ap-b ls /tmp/phoss-ap/fwd
#
x-ap-common: &ap-common
  build:
    context: ../..
    dockerfile: docker/two-instances/Dockerfile
  restart: unless-stopped
  volumes:
    - ./certs:/certs:ro
  depends_on:
    postgres:
      condition: service_healthy

x-ap-env: &ap-env
  PHOSSAP_JDBC_USER: peppol
  PHOSSAP_JDBC_PASSWORD: peppol
  GLOBAL_DATAPATH: /tmp/phoss-ap/
  PEPPOL_STAGE: test
  PHASE4_API_REQUIREDTOKEN: phoss-ap-development-token
  # Own CA instead of the Peppol test CA - only effective on the test stage
  PEPPOL_DEV_TRUSTED_CA_PATH: /certs/dev-ca.pem
  ORG_APACHE_WSS4J_CRYPTO_MERLIN_TRUSTSTORE_FILE: /certs/dev-truststore.p12
  ORG_APACHE_WSS4J_CRYPTO_MERLIN_TRUSTSTORE_PASSWORD: peppol
  ORG_APACHE_WSS4J_CRYPTO_MERLIN_KEYSTORE_ALIAS: ap
  ORG_APACHE_WSS4J_CRYPTO_MERLIN_KEYSTORE_PASSWORD: peppol
  ORG_APACHE_WSS4J_CRYPTO_MERLIN_KEYSTORE_PRIVATE_PASSWORD: peppol
  # Received documents are written to this directory
  FORWARDING_MODE: filesystem
  FORWARDING_FILESYSTEM_DIRECTORY: /tmp/phoss-ap/fwd

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: peppol
      POSTGRES_PASSWORD: peppol
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peppol -d phoss-ap-b"]
      interval: 5s
      timeout: 3s
      retries: 10

  ap-a:
    <<: *ap-common
    ports:
      - "8081:8080"
    environment:
      <<: *ap-env
      PHOSSAP_JDBC_URL: jdbc:postgresql://postgres:5432/phoss-ap-a
      PEPPOL_OWNER_SEATID: PXX000001
      PHASE4_ENDPOINT_ADDRESS: http://ap-a:8080/as4
      ORG_APACHE_WSS4J_CRYPTO_MERLIN_KEYSTORE_FILE: /certs/ap-a.p12
      # Everything is sent to B - no SMP lookup
      OUTBOUND_DEV_FIXED_ENDPOINT_URL: http://ap-b:8080/as4
      OUTBOUND_DEV_FIXED_ENDPOINT_CERTIFICATE_PATH: /certs/ap-b.pem

  ap-b:
    <<: *ap-common
    ports:
      - "8082:8080"
    environment:
      <<: *ap-env
      PHOSSAP_JDBC_URL: jdbc:postgresql://postgres:5432/phoss-ap-b
      PEPPOL_OWNER_SEATID: PXX000002
      PHASE4_ENDPOINT_ADDRESS: http://ap-b:8080/as4
      ORG_APACHE_WSS4J_CRYPTO_MERLIN_KEYSTORE_FILE: /certs/ap-b.p12
      # Everything is sent to A - no SMP lookup
      OUTBOUND_DEV_FIXED_ENDPOINT_URL: http://ap-a:8080/as4
      OUTBOUND_DEV_FIXED_ENDPOINT_CERTIFICATE_PATH: /certs/ap-a.pem
